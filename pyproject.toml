[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "repo-pulse"
version = "0.1.0"
description = "A Python CLI that scans repositories and generates clean project health reports."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nitish Vimal" }]
keywords = [
  "repository",
  "cli",
  "health-check",
  "developer-tools",
  "python",
  "automation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/n-vim/repo-pulse"
Repository = "https://github.com/n-vim/repo-pulse"
Issues = "https://github.com/n-vim/repo-pulse/issues"

[project.scripts]
repopulse = "repopulse.cli:app"
repo-pulse = "repopulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
